name: Windows EXE

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: GUI import check
        run: python -c "import telegram_exporter.gui; import telegram_exporter.tgctl; print('GUI + tgctl import OK')"

      - name: Build TGExporter EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --paths src --name TGExporter launcher.py

      - name: Build tgctl EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --console --onefile --paths src --name tgctl --distpath dist\tgctl --workpath build\tgctl tgctl_launcher.py

      - name: Smoke-test packaged EXEs
        shell: pwsh
        run: |
          & .\dist\TGExporter.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\tgctl\tgctl.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: TGExporter-windows-x64
          path: |
            dist/TGExporter.exe
            dist/tgctl/tgctl.exe
          if-no-files-found: error
          retention-days: 30
