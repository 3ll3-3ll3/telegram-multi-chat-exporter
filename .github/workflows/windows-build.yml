name: Windows EXE

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name TelegramMultiChatExporter --collect-all telethon --collect-all PySide6 src/telegram_exporter/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMultiChatExporter-windows-x64
          path: dist/TelegramMultiChatExporter.exe
          if-no-files-found: error
          retention-days: 30
