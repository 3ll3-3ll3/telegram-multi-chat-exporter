name: Release TG Exporter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: GUI + CLI import check
        shell: pwsh
        run: |
          python -c "from telegram_exporter.gui import MainWindow; from telegram_exporter.main import main; import telegram_exporter.tgctl; print('GUI + tgctl import OK')"

      - name: Build one-file TGExporter EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name TGExporter --paths src --distpath dist\onefile --workpath build\onefile launcher.py

      - name: Build portable TGExporter onedir
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name TGExporter --paths src --distpath dist\portable --workpath build\portable launcher.py

      - name: Build tgctl EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --console --onefile --name tgctl --paths src --distpath dist\tgctl --workpath build\tgctl tgctl_launcher.py
          Copy-Item .\dist\tgctl\tgctl.exe .\dist\portable\TGExporter\tgctl.exe

      - name: Smoke-test packaged builds
        shell: pwsh
        run: |
          & .\dist\onefile\TGExporter.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\portable\TGExporter\TGExporter.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\tgctl\tgctl.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\portable\TGExporter\tgctl.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare release assets
        id: prep
        shell: pwsh
        run: |
          $tag = (Get-Content VERSION -Raw).Trim()
          if (-not $tag.StartsWith('v')) { throw 'VERSION must start with v' }
          $notesFile = "docs\releases\$tag.md"
          if (-not (Test-Path $notesFile)) { throw "Missing release notes: $notesFile" }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $exe = "release-assets\TGExporter-$tag-windows-x64.exe"
          $portableZip = "release-assets\TGExporter-$tag-windows-x64-portable.zip"
          $tgctl = "release-assets\tgctl.exe"
          $checksums = "release-assets\SHA256SUMS.txt"
          Copy-Item .\dist\onefile\TGExporter.exe $exe
          Copy-Item .\dist\tgctl\tgctl.exe $tgctl
          Compress-Archive -Path .\dist\portable\TGExporter -DestinationPath $portableZip -Force
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $tgctlHash = (Get-FileHash $tgctl -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  $(Split-Path $exe -Leaf)",
            "$zipHash  $(Split-Path $portableZip -Leaf)",
            "$tgctlHash  $(Split-Path $tgctl -Leaf)"
          ) | Set-Content -Encoding ascii $checksums
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "portable_zip=$portableZip" >> $env:GITHUB_OUTPUT
          "tgctl=$tgctl" >> $env:GITHUB_OUTPUT
          "checksums=$checksums" >> $env:GITHUB_OUTPUT
          "notes_file=$notesFile" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.prep.outputs.tag }}'
          $exe = '${{ steps.prep.outputs.exe }}'
          $portableZip = '${{ steps.prep.outputs.portable_zip }}'
          $tgctl = '${{ steps.prep.outputs.tgctl }}'
          $checksums = '${{ steps.prep.outputs.checksums }}'
          $notesFile = '${{ steps.prep.outputs.notes_file }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $portableZip $tgctl $checksums --clobber
            gh release edit $tag --title "TG Exporter $tag" --notes-file $notesFile
          } else {
            gh release create $tag $exe $portableZip $tgctl $checksums --target "$env:GITHUB_SHA" --title "TG Exporter $tag" --notes-file $notesFile
          }
