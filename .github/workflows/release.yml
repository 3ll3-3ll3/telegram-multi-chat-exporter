name: Release Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: GUI import check
        shell: pwsh
        run: |
          python -c "from telegram_exporter.gui import MainWindow; from telegram_exporter.main import main; print('GUI import OK')"

      - name: Build one-file EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name TelegramMultiChatExporter --paths src --distpath dist\onefile --workpath build\onefile launcher.py

      - name: Build portable onedir
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name TelegramMultiChatExporter --paths src --distpath dist\portable --workpath build\portable launcher.py

      - name: Smoke-test packaged builds
        shell: pwsh
        run: |
          & .\dist\onefile\TelegramMultiChatExporter.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\portable\TelegramMultiChatExporter\TelegramMultiChatExporter.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare release assets
        id: prep
        shell: pwsh
        run: |
          $tag = (Get-Content VERSION -Raw).Trim()
          if (-not $tag.StartsWith('v')) { throw 'VERSION must start with v' }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $exe = "release-assets\TelegramMultiChatExporter-$tag-windows-x64.exe"
          $portableZip = "release-assets\TelegramMultiChatExporter-$tag-windows-x64-portable.zip"
          $checksums = "release-assets\SHA256SUMS.txt"
          Copy-Item .\dist\onefile\TelegramMultiChatExporter.exe $exe
          Compress-Archive -Path .\dist\portable\TelegramMultiChatExporter -DestinationPath $portableZip -Force
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  $(Split-Path $exe -Leaf)",
            "$zipHash  $(Split-Path $portableZip -Leaf)"
          ) | Set-Content -Encoding ascii $checksums
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "portable_zip=$portableZip" >> $env:GITHUB_OUTPUT
          "checksums=$checksums" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.prep.outputs.tag }}'
          $exe = '${{ steps.prep.outputs.exe }}'
          $portableZip = '${{ steps.prep.outputs.portable_zip }}'
          $checksums = '${{ steps.prep.outputs.checksums }}'
          $notes = @"
          Windows GUI Telegram multi-chat batch exporter.

          Highlights:
          - Searchable focused workspace: the full account catalogue stays out of the main editor, and only selected working groups are shown.
          - Per-group independent export rules: custom date range, current unread, or since previous successful export.
          - Current-unread mode is frozen to the latest catalogue-refresh snapshot, so messages arriving later are excluded from that batch.
          - Optional per-group "mark as read after export" policy is default-off and only runs after result.json was written successfully.
          - A failed export never changes Telegram read state; a failed read acknowledgement is reported separately without deleting the JSON.
          - Text-only export; media files are not downloaded, while text captions are preserved.
          - Each run creates an independent batch directory and each group gets its own result.json.
          - No master message database and no historical batch merging.
          - Telegram Desktop-style JSON fields for plain-text messages.
          - Telegram API credentials and session files remain local-only.
          - Automatically uses the enabled Windows system proxy (for example Clash/Mihomo at 127.0.0.1:7890) for Telegram transport.
          - qasync-safe non-blocking login and message-dialog flow.

          Downloads:
          - Single EXE: easiest to run.
          - Portable ZIP: onedir build without the PyInstaller one-file self-extraction layer.
          - SHA256SUMS.txt: integrity hashes for both assets.

          Validation:
          - Unit tests passed.
          - GUI import check passed.
          - One-file EXE smoke-test passed.
          - Portable onedir EXE smoke-test passed.
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $portableZip $checksums --clobber
          } else {
            gh release create $tag $exe $portableZip $checksums --target "$env:GITHUB_SHA" --title "Telegram Multi-Chat Exporter $tag" --notes "$notes"
          }
